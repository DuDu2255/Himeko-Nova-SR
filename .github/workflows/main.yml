name: Build Himeko-NovaSR


on:

  workflow_dispatch:

  push:
    branches:
      - main



permissions:

  contents: write



jobs:


  build:


    name: Build ${{ matrix.name }}


    strategy:

      fail-fast: false

      matrix:

        include:


          - name: linux-x64

            os: ubuntu-latest

            target: x86_64-linux



          - name: linux-arm64

            os: ubuntu-latest

            target: aarch64-linux



          - name: windows-x64

            os: windows-latest

            target: x86_64-windows



    runs-on: ${{ matrix.os }}



    steps:



      # 拉取源码

      - name: Checkout

        uses: actions/checkout@v4

        with:

          fetch-depth: 0




      # 安装 Zig

      - name: Setup Zig

        uses: mlugg/setup-zig@v2

        with:

          version: 0.14.1




      # 修复 Zig 文件大小写

      - name: Fix Zig filename case

        shell: bash

        run: |


          echo "Checking Session.zig"


          find gameserver/src -iname "*session*" || true



          if [ "${{ runner.os }}" = "Windows" ]; then


              echo "Windows detected"

              echo "Skip case rename"


          else


              if [ -f gameserver/src/Session.zig ] && [ ! -f gameserver/src/session.zig ]; then


                  echo "Creating session.zig"


                  cp gameserver/src/Session.zig gameserver/src/session.zig


              fi


          fi




          if [ -f gameserver/src/Session.zig ] || [ -f gameserver/src/session.zig ]; then


              echo "Session file OK"


          else


              echo "Session file missing"

              exit 1


          fi





      # 编译

      - name: Build

        shell: bash

        run: |


          zig build \
          -Dtarget=${{ matrix.target }} \
          -Doptimize=ReleaseFast





      # 整理 Release

      - name: Prepare Release

        shell: bash

        run: |


          mkdir release



          echo "Copy binary"


          cp -r zig-out/bin/* release/ || true




          echo "Copy resources"


          cp -r resources release/ || true

          cp -r lua release/ || true

          cp -r protocol release/ || true




          echo "Copy configs"


          cp frecsr-data.json release/ || true

          cp hotfix.json release/ || true




          echo "Release files"

          ls -la release






      # 压缩

      - name: Package

        shell: bash

        run: |


          cd release


          7z a ../Himeko-NovaSR-${{ matrix.name }}.zip *






      # 上传

      - name: Upload Artifact

        uses: actions/upload-artifact@v4

        with:


          name: Himeko-NovaSR-${{ matrix.name }}


          path: Himeko-NovaSR-${{ matrix.name }}.zip








  release:


    needs: build


    runs-on: ubuntu-latest



    steps:



      - name: Download artifacts

        uses: actions/download-artifact@v4





      - name: Create Release


        uses: softprops/action-gh-release@v2


        with:


          tag_name: build-${{ github.run_number }}


          name: Himeko-NovaSR Build ${{ github.run_number }}


          files: |


            **/*.zip



        env:


          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
